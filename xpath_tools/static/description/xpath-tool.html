<!DOCTYPE html>
<html>
<head>
  <title>XML ↔ XPath Tool</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    textarea, input {
      width: 100%; padding: 8px; margin: 6px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    textarea { height: 100px; resize: vertical; }
    .label { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>📄 XML View Input</h2>
  <textarea id="xmlView" placeholder="Paste full XML view arch here..." oninput="triggerAll()"></textarea>

  <div class="label">🔍 Tag to XPath</div>
  <textarea id="tagInput" placeholder="Paste tag like <field name='name'/>" oninput="findXPath()"></textarea>
  <textarea id="xpathOutput" placeholder="One or more XPaths found will appear here..." readonly></textarea>

  <div class="label">📤 XPath to Sub-XML</div>
  <input id="xpathInput" placeholder="Enter XPath like //field[@name='name']" oninput="getMatchingXMLs()"/>
  <textarea id="subXmlOutput" placeholder="Matching sub-XMLs or errors will appear here" readonly></textarea>

  <script>
    let xmlDoc = null;

    function parseXML() {
      const xmlStr = document.getElementById("xmlView").value;
      try {
        const parser = new DOMParser();
        xmlDoc = parser.parseFromString(xmlStr, "application/xml");

        const errorNode = xmlDoc.querySelector("parsererror");
        if (errorNode) throw new Error("Invalid XML syntax");
      } catch (e) {
        xmlDoc = null;
      }
    }

    function getNodeXPath(node) {
      if (!node || node.nodeType !== 1) return "";
      if (!node.parentNode || node === xmlDoc.documentElement)
        return "/" + buildNodeSelector(node);

      return getNodeXPath(node.parentNode) + "/" + buildNodeSelector(node);
    }

    function buildNodeSelector(node) {
      const attrs = ["name", "id", "t-name", "t-field", "class"];
      for (let attr of attrs) {
        const val = node.getAttribute(attr);
        if (val) return `${node.nodeName}[@${attr}='${val}']`;
      }

      const siblings = Array.from(node.parentNode.children)
        .filter(n => n.nodeName === node.nodeName);
      const index = siblings.indexOf(node) + 1;
      return siblings.length > 1 ? `${node.nodeName}[${index}]` : node.nodeName;
    }

    function nodesEqualShallow(a, b) {
      if (a.nodeName !== b.nodeName) return false;

      const aAttrs = a.attributes;
      const bAttrs = b.attributes;
      if (aAttrs.length !== bAttrs.length) return false;

      for (let i = 0; i < aAttrs.length; i++) {
        const name = aAttrs[i].name;
        if (a.getAttribute(name) !== b.getAttribute(name)) return false;
      }
      return true;
    }

    function findXPath() {
      parseXML();
      const output = document.getElementById("xpathOutput");
      output.value = "";

      if (!xmlDoc) {
        output.value = "❌ Invalid or missing XML.";
        return;
      }

      const tagHTML = document.getElementById("tagInput").value.trim();
      if (!tagHTML) {
        output.value = "";
        return;
      }

      try {
        const dummy = new DOMParser().parseFromString(`<root>${tagHTML}</root>`, "application/xml");
        const searchNode = dummy.documentElement.firstElementChild;
        if (!searchNode) {
          output.value = "❌ Invalid tag input.";
          return;
        }

        const candidates = xmlDoc.getElementsByTagName(searchNode.nodeName);
        const matches = [];

        for (let node of candidates) {
          if (nodesEqualShallow(node, searchNode)) {
            matches.push(getNodeXPath(node));
          }
        }

        output.value = matches.length ? matches.join("\n") : "❌ Tag not found in XML.";
      } catch (e) {
        output.value = "❌ Tag parse error.";
      }
    }

    function getMatchingXMLs() {
      parseXML();
      const xpath = document.getElementById("xpathInput").value.trim();
      const output = document.getElementById("subXmlOutput");
      output.value = "";

      if (!xmlDoc) {
        output.value = "❌ Invalid or missing XML.";
        return;
      }

      if (!xpath) {
        output.value = "";
        return;
      }

      try {
        const result = xmlDoc.evaluate(xpath, xmlDoc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
        const matches = [];

        for (let i = 0; i < result.snapshotLength; i++) {
          const node = result.snapshotItem(i);
          const xml = new XMLSerializer().serializeToString(node);
          matches.push(xml);
        }

        output.value = matches.length ? matches.join("\n\n") : "❌ No matching nodes.";
      } catch (e) {
        output.value = "❌ XPath error: " + e.message;
      }
    }

    function triggerAll() {
      findXPath();
      getMatchingXMLs();
    }
  </script>
</body>
</html>
